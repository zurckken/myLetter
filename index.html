<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c1019">
<title>A letter for Kelsheiy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<audio id="music" src="music.mp3" loop preload="auto"></audio>
<button id="musicBtn" class="pill" type="button" aria-pressed="true" hidden>♪ Music on</button>
<button id="skip" class="pill" type="button" hidden>Skip animation</button>

<main>
  <section id="intro" class="scene intro">
    <div class="intro-text">
      <p class="hey">Hey, Kelsheiy. ♡</p>
      <p class="sub">I made a little something for you.</p>
    </div>
    <div class="env-float">
      <div class="env-wrap" id="envWrap">
        <div class="env" id="env" role="button" tabindex="0" aria-label="Open your letter">
          <div class="pn env-back"></div>
          <div class="pn env-paper"></div>
          <div class="pn env-l"></div>
          <div class="pn env-r"></div>
          <div class="pn env-b"></div>
          <div class="pn env-flap"></div>
          <div class="seal" id="seal"><span>K</span></div>
        </div>
      </div>
    </div>
    <button id="openBtn" class="btn" type="button">Open your letter ♡</button>
  </section>

  <section id="reader" class="scene reader" hidden>
    <article class="paper"><div id="letter"></div></article>
    <div class="after"><button id="surpriseBtn" class="btn" type="button" hidden>One last thing... ♡</button></div>
  </section>

  <section id="ending" class="scene ending" hidden>
    <h2 id="endTitle"></h2>
    <p id="endMsg"></p>
    <p id="endSig" class="sig"></p>
    <button id="replayBtn" class="btn" type="button"></button>
  </section>
</main>

<button id="fullBtn" class="pill" type="button" hidden>Show full letter</button>

<div id="veil" class="veil" role="dialog" aria-modal="true" aria-label="One last thing">
  <div class="veil-box">
    <p id="sMsg"></p>
    <button id="contBtn" class="btn" type="button" hidden>Continue ♡</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
